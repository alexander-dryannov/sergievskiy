<div class="card">
    <div class="card-body{% if fixed %} border border-success{% endif %}">
        <h5 class="card-title text-center">{{ post.title }}</h5>
        <p class="card-text">{{ post.text | truncatewords:24 }}</p>
        <p class="text-muted text-end">{{ post.created_at.date }}</p>
    </div>
</div>
